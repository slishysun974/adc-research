<g id="takeaway" font-family="Microsoft YaHei, Arial, sans-serif"><text x="64" y="611" font-size="24" fill="#226E9C">阶段结论：预测强度由模型条件与输入资料共同决定。</text></g>
<g id="footer" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#596D7B"><line x1="64" y1="652" x2="1216" y2="652" stroke="#D7E0E7"/><text x="64" y="682">依据：EXP-015、016、038。程序一致性与真实芯片适用性分别评价。</text><text x="1216" y="682" text-anchor="end">07</text></g>
