<text x="64" y="202" font-size="28" font-weight="700" fill="#226E9C">未知模拟非线性下，数字校准能够做到什么</text>
<text x="64" y="253" font-size="24">以Gu为基线，研究内部观测怎样推动系数学习，</text><text x="64" y="293" font-size="24">以及系数变化怎样影响最终码误差和频谱。</text>
