<text x="64" y="439" font-size="24">可复查的行为平台、条件性理论及数字实现基线。</text><text x="64" y="479" font-size="24">对一批有限场景，已有剩余误差的受控解释。</text>
<text x="64" y="561" font-size="24" fill="#226E9C">下一关键关系：实际可见信息如何支持有益的在线调整。</text>
