<g id="meaning" font-family="Microsoft YaHei, Arial, sans-serif" fill="#243746"><text x="840" y="287" font-size="28" font-weight="700" fill="#21857A">1/4步长取得后期收益</text><text x="840" y="346" font-size="24">两组各五个种子，均优于</text><text x="840" y="387" font-size="24">对应单位系数不更新参考。</text><text x="840" y="461" font-size="24">MSE为输出与理想电平差</text><text x="840" y="502" font-size="24">的平方平均，保留直流误差。</text><text x="840" y="578" font-size="20" fill="#596D7B">该结果不确定全局最优步长。</text></g>
