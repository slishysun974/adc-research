<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content">
<rect width="1280" height="720" fill="#FFFFFF"/>
<g id="title" font-family="Microsoft YaHei, Arial, sans-serif"><text x="64" y="55" font-size="20" fill="#596D7B">模块六　后台校准的性能、稳定性与适用条件</text><text x="64" y="115" font-size="40" fill="#16324F" font-weight="700">持续后台运行的评价方法</text></g>
<g id="frozen" font-family="Microsoft YaHei, Arial, sans-serif" fill="#243746"><text x="64" y="207" font-size="28" font-weight="700" fill="#16324F">训练后冻结系数</text><text x="64" y="254" font-size="24">先学习，再固定检查点系数进行评分。</text><text x="64" y="296" font-size="24">用于评价该时刻的校正结果。</text><rect x="720" y="224" width="200" height="36" fill="#226E9C"/><rect x="920" y="224" width="260" height="36" fill="#D7E0E7"/><text x="820" y="299" font-size="20" text-anchor="middle" fill="#596D7B">学习</text><text x="1050" y="299" font-size="20" text-anchor="middle" fill="#596D7B">冻结评分</text></g>
<line x1="64" y1="343" x2="1216" y2="343" stroke="#D7E0E7"/>
<g id="background" font-family="Microsoft YaHei, Arial, sans-serif" fill="#243746"><text x="64" y="408" font-size="28" font-weight="700" fill="#16324F">持续后台运行</text><text x="64" y="455" font-size="24">转换与学习同时继续，保留全部输出。</text><text x="64" y="497" font-size="24">用于评价校正和持续适应共同作用后的净收益。</text><rect x="720" y="425" width="460" height="36" fill="#21857A"/><text x="950" y="500" font-size="20" text-anchor="middle" fill="#596D7B">学习期间的全部输出参与评分</text></g>
<g id="takeaway" font-family="Microsoft YaHei, Arial, sans-serif"><text x="64" y="588" font-size="28" fill="#226E9C">启动、后期输出与输入变化后的恢复分别评价。</text><text x="64" y="627" font-size="20" fill="#596D7B">两种方式回答不同的问题。报告中同时保留码误差与频谱指标。</text></g>
<g id="footer" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#596D7B"><line x1="64" y1="652" x2="1216" y2="652" stroke="#D7E0E7"/><text x="64" y="682">依据：模块六、EXP-062、069、070。右侧时间条仅示意评价过程，长度不表示实际预算。</text><text x="1216" y="682" text-anchor="end">15</text></g>
</svg>
