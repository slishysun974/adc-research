[project]
name = "adc-research"
version = "0.1.0"
description = "Independent experimental and analytical models for pipeline ADC research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

